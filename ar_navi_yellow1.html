<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR避難ナビ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Helvetica Neue',sans-serif;
       height:100vh; width:100vw; overflow:hidden; }

/* 横向き指示 */
#rotate-screen {
  position:fixed; inset:0; background:#111; z-index:2000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center;
}
#rotate-screen.hidden { display:none; }
.ri { font-size:64px; margin-bottom:20px; animation:sw 1.5s ease-in-out infinite; }
@keyframes sw { 0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(30deg)} }

/* スキップボタン */
#skip-rotate-btn {
  margin-top:20px; padding:10px 22px; font-size:14px;
  background:rgba(255,255,255,0.15); color:#fff;
  border:1px solid rgba(255,255,255,0.4); border-radius:20px; cursor:pointer;
}

/* 権限画面 */
#perm-screen {
  position:fixed; inset:0; background:#111; z-index:1800;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; text-align:center;
}
#perm-screen.hidden { display:none; }
.sbtn {
  margin-top:24px; padding:16px 44px; font-size:18px; font-weight:bold;
  background:#FFD700; color:#000; border:none; border-radius:12px; cursor:pointer;
}

/* ── z-index 設計 ──────────────────────
  5  : AR canvas（障害物描画）
  50 : Rain canvas（雨・霧・全画面、マップのみ除外）
  60 : 上部ナビバー・右下矢印（雨の上に出る）
  100: 左下マップパネル（雨の上に出る）
─────────────────────────────────────── */

/* 全画面 AR キャンバス */
#ar-canvas   { position:fixed; inset:0; z-index:5; }
/* 全画面 豪雨キャンバス */
#rain-canvas { position:fixed; inset:0; z-index:50; pointer-events:none; }

/* ── 上部ナビバー（z=60 雨の上）── */
#top-bar {
  position:fixed; top:0; left:0; right:0; z-index:60;
  background:rgba(0,0,0,0.78);
  border-bottom:1px solid rgba(255,255,255,0.12);
}
#top-row1 {
  display:flex; align-items:center; padding:8px 14px; gap:10px; height:58px;
}
/* 小型矢印 */
#nav-arrow-outer {
  width:36px; height:36px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
#nav-arrow-small {
  width:0; height:0;
  border-left:11px solid transparent; border-right:11px solid transparent;
  border-bottom:28px solid #FFD700;
  filter:drop-shadow(0 0 6px rgba(255,215,0,0.8));
  transition:transform .25s ease-out, border-bottom-color .3s;
  transform-origin:center 65%;
}
#nav-arrow-small.avoid { border-bottom-color:#FF6600; }
#nav-msg {
  flex:1; font-size:15px; font-weight:bold;
  white-space:nowrap; overflow:hidden;
  text-shadow:0 0 8px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,1);
}
.msg-safe  { color:#5FE080; }
.msg-avoid { color:#FF6600; }
.msg-wait  { color:rgba(255,255,255,0.5); }
#nav-right { text-align:right; flex-shrink:0; }
#nav-dist-top {
  font-size:24px; font-weight:900; color:#FFD700; line-height:1;
  text-shadow:0 0 10px rgba(255,215,0,0.7);
}
#nav-dist-lbl { font-size:10px; color:rgba(255,255,255,0.45); }

/* 障害物警告行 */
#top-row2 {
  display:flex; align-items:center; padding:4px 14px 7px; gap:10px;
  border-top:1px solid rgba(255,100,0,0.3);
  background:rgba(50,10,0,0.75);
}
#top-row2.hidden { display:none; }
#obs-warn-badge {
  font-size:11px; font-weight:bold; padding:2px 8px;
  border-radius:4px; background:rgba(255,60,0,0.85); white-space:nowrap;
}
#obs-warn-dist {
  font-size:20px; font-weight:900; color:#FF6600; min-width:64px;
  text-shadow:0 0 8px rgba(255,100,0,0.7);
}
#obs-warn-bar-wrap { flex:1; }
#obs-warn-bar-label { font-size:9px; color:rgba(255,255,255,0.3); margin-bottom:2px; }
#obs-warn-bar-track { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
#obs-warn-bar-fill  { height:100%; border-radius:3px; transition:width .4s, background .3s; }
#obs-warn-dir { font-size:11px; color:rgba(255,200,150,0.8); white-space:nowrap; }

/* ── 左下：マップ（正方形・z=100）── */
#panel-map {
  position:fixed; bottom:0; left:0; z-index:100;
  height:42vh; width:42vh;
  background:rgba(0,14,0,0.92);
  border-top:1px solid rgba(100,200,100,0.3);
  border-right:1px solid rgba(100,200,100,0.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6px;
}
.plbl { font-size:9px; color:rgba(255,255,255,0.25); letter-spacing:1px; margin-bottom:4px; }
#minimap { width:100%; height:100%; max-width:100%; max-height:calc(100% - 20px); border-radius:6px; }
#map-scale { font-size:8px; color:rgba(255,255,255,0.2); margin-top:3px; }

/* ── 右下：矢印のみ（z=60 雨の上）── */
#panel-goal {
  position:fixed; bottom:24px; right:24px; z-index:60;
  display:flex; flex-direction:column; align-items:center;
}
#arrow-wrap {
  width:86px; height:110px;
  display:flex; align-items:center; justify-content:center;
}
#arrow {
  width:0; height:0;
  border-left:40px solid transparent; border-right:40px solid transparent;
  border-bottom:100px solid #FFD700;
  filter: drop-shadow(0 0 18px rgba(255,215,0,0.8))
          drop-shadow(0 0 8px rgba(255,215,0,0.5));
  transition:transform .25s ease-out, border-bottom-color .3s;
  transform-origin:center 65%;
}
#arrow.avoid {
  border-bottom-color:#FF6600;
  filter: drop-shadow(0 0 18px rgba(255,100,0,1))
          drop-shadow(0 0 8px rgba(255,100,0,0.8));
}

/* 送信情報（右下隅） */
#send-info {
  position:fixed; bottom:6px; right:8px; z-index:60;
  font-size:10px; color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px;
}

/* 視界ラベル */
#visibility-note {
  position:fixed; bottom:4px; left:43vh; z-index:60;
  font-size:9px; color:rgba(180,210,255,0.3); letter-spacing:1px; pointer-events:none;
}
</style>
</head>
<body>

<!-- 横向き指示 -->
<div id="rotate-screen">
  <div class="ri">📱</div>
  <div style="font-size:22px;font-weight:bold;margin-bottom:12px;">スマートフォンを横向きに</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.8;">
    左右どちら向きでもOKです<br>切り替わらない場合は下のボタンを押してください
  </div>
  <button id="skip-rotate-btn">横向きにしたので進む ▶</button>
</div>

<!-- 権限画面 -->
<div id="perm-screen" class="hidden">
  <div style="font-size:20px;font-weight:bold;margin-bottom:6px;">⛈️ AR避難ナビ</div>
  <div style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:18px;">豪雨シミュレーション</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.65);line-height:2.4;">
    📍 位置情報（GPS）<br>🧭 コンパス（方向センサー）
  </div>
  <button class="sbtn" id="start-btn">許可して開始 ▶</button>
  <div style="margin-top:12px;font-size:10px;color:rgba(255,255,255,0.2);">iOSはSafariで開いてください</div>
</div>

<!-- z=5：AR障害物キャンバス -->
<canvas id="ar-canvas"></canvas>
<!-- z=50：豪雨キャンバス -->
<canvas id="rain-canvas"></canvas>

<!-- z=60：上部ナビバー -->
<div id="top-bar">
  <div id="top-row1">
    <div id="nav-arrow-outer"><div id="nav-arrow-small"></div></div>
    <div id="nav-msg" class="msg-wait">📡 GPS取得中...</div>
    <div id="nav-right">
      <div id="nav-dist-top">--</div>
      <div id="nav-dist-lbl">目的地まで(m)</div>
    </div>
  </div>
  <div id="top-row2" class="hidden">
    <div id="obs-warn-badge">障害物</div>
    <div id="obs-warn-dist">-- m</div>
    <div id="obs-warn-bar-wrap">
      <div id="obs-warn-bar-label">障害物まで</div>
      <div id="obs-warn-bar-track"><div id="obs-warn-bar-fill" style="width:0;background:#FFCC00;"></div></div>
    </div>
    <div id="obs-warn-dir">方向: --</div>
  </div>
</div>

<!-- z=100：左下マップ -->
<div id="panel-map">
  <div class="plbl">全体マップ（北↑）</div>
  <canvas id="minimap" width="600" height="600"></canvas>
  <div id="map-scale"></div>
</div>

<!-- z=60：右下矢印のみ -->
<div id="panel-goal">
  <div id="arrow-wrap"><div id="arrow"></div></div>
</div>

<div id="send-info">送信: 待機中</div>
<div id="visibility-note">👁 視界約5m シミュレーション</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBG-JwC9VKwnSHaSkvGLzNLvXtvZ3U0q6M",
  authDomain:"heavy-rain-evacuation.firebaseapp.com",
  projectId:"heavy-rain-evacuation",
  storageBucket:"heavy-rain-evacuation.firebasestorage.app",
  appId:"1:405482442865:web:99c4a046167821b4abcbd0"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// ★ 実験設定
const GOAL={lat:36.1085084,lng:139.3630287,name:"ゴール地点★"};
const OBSTACLES=[
  {lat:36.1094372,lng:139.3648114,radiusM:3.0,name:"障害物",widthM:3.0,heightM:2.0,rotationDeg:0},
];
const AREA=[[36.110889,139.360278],[36.110306,139.367194],[36.105889,139.365111],[36.106222,139.357861]];

// ★ 豪雨・視界設定
const RAIN={drops:280,speed:18,angle:20,fogOpa:0.17,visM:5.0};
const OBS_SHOW=15.0;
const AR_FOV=46;

let myLat=null,myLng=null,deviceHeading=0,animFrame=0;

/* ===== 徒歩ルート管理 ===== */
let routeCoords = [];       // [[緯度, 経度], ...]
let routeDistanceM = 0;     // ルート全体の距離（m）
let routeLastStart = null;  // 前回ルートを取得した位置
let routeLoading = false;
let routeLastTime = 0;
let routeError = "";

// GPS位置が変わったら、必要なときだけルートを再取得
async function refreshWalkingRoute(force = false) {
  if (myLat === null || myLng === null || routeLoading) return;

  const moved = routeLastStart
    ? dist(myLat, myLng, routeLastStart.lat, routeLastStart.lng)
    : Infinity;

  // 初回、15m以上移動、または30秒経過で再取得
  if (!force && routeCoords.length > 0 &&
      moved < 15 && Date.now() - routeLastTime < 30000) {
    return;
  }

  routeLoading = true;

  try {
    const response = await fetch(
      "https://valhalla1.openstreetmap.de/route",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Client-Id": "ar-evacuation-navigation"
        },
        body: JSON.stringify({
          locations: [
            { lat: myLat, lon: myLng },
            { lat: GOAL.lat, lon: GOAL.lng }
          ],
          costing: "pedestrian",
          units: "kilometers",
          language: "ja-JP",
          format: "osrm",
          shape_format: "geojson"
        })
      }
    );

    if (!response.ok) {
      throw new Error("ルート取得に失敗: HTTP " + response.status);
    }

    const data = await response.json();
    const route = data.routes?.[0];

    if (!route?.geometry?.coordinates?.length) {
      throw new Error("徒歩ルートが見つかりません");
    }

    // GeoJSON座標は [経度, 緯度] の順
    routeCoords = route.geometry.coordinates.map(
      ([lng, lat]) => [lat, lng]
    );

    // OSRM形式のdistanceはメートル
    routeDistanceM = route.distance;
    routeLastStart = { lat: myLat, lng: myLng };
    routeLastTime = Date.now();
    routeError = "";

    updateNav();
    drawMap();
  } catch (err) {
    console.error('徒歩ルート取得エラー:', err);
    routeError = err.message || 'ルート取得エラー';
    updateNav();
    drawMap();
  } finally {
    routeLoading = false;
    updateNav();
  }
}

/* ===== ルート上の現在位置・次の進行方向 ===== */
function getRouteProgress() {
  if (routeCoords.length < 2 || myLat === null) return null;

  // 現在地に最も近いルート上の点を探す
  let nearestIndex = 0;
  let nearestDistance = Infinity;

  routeCoords.forEach(([lat, lng], i) => {
    const d = dist(myLat, myLng, lat, lng);
    if (d < nearestDistance) {
      nearestDistance = d;
      nearestIndex = i;
    }
  });

  // 近すぎる点を向いて矢印がふらつかないよう、
  // ルート上で数m先の点を目標にする
  let targetIndex = nearestIndex;
  let lookAhead = 0;

  while (targetIndex < routeCoords.length - 1 && lookAhead < 8) {
    const a = routeCoords[targetIndex];
    const b = routeCoords[targetIndex + 1];
    lookAhead += dist(a[0], a[1], b[0], b[1]);
    targetIndex++;
  }

  // 現在地から最も近い点を経由してゴールまでの残り距離を計算
  let remaining = nearestDistance;

  for (let i = nearestIndex; i < routeCoords.length - 1; i++) {
    const a = routeCoords[i];
    const b = routeCoords[i + 1];
    remaining += dist(a[0], a[1], b[0], b[1]);
  }

  const target = routeCoords[targetIndex];

  return {
    remaining,
    bearing: bear(myLat, myLng, target[0], target[1])
  };
}

let deviceId=(()=>{let id=localStorage.getItem('dv');if(!id){id='u'+Math.random().toString(36).slice(2,9);localStorage.setItem('dv',id);}return id;})();

const arC=document.getElementById('ar-canvas');    const arX=arC.getContext('2d');
const rainC=document.getElementById('rain-canvas'); const rainX=rainC.getContext('2d');
const mapC=document.getElementById('minimap');      const mapX=mapC.getContext('2d');

// ===== 雨粒 =====
class Drop {
  constructor(W,H,init=false){this.W=W;this.H=H;this.reset(init);}
  reset(init=false){
    this.x=Math.random()*(this.W+200)-100;
    this.y=init?Math.random()*this.H:-60;
    this.len=15+Math.random()*25; this.spd=RAIN.speed*(0.7+Math.random()*0.6);
    this.opa=0.35+Math.random()*0.45; this.w=0.5+Math.random()*1.2;
    if(Math.random()<0.3){this.len*=0.5;this.w*=0.6;this.opa*=0.5;}
  }
  update(){const r=RAIN.angle*Math.PI/180;this.x+=Math.sin(r)*this.spd;this.y+=Math.cos(r)*this.spd;if(this.y>this.H+60||this.x>this.W+100)this.reset();}
  draw(ctx){
    const r=RAIN.angle*Math.PI/180;
    ctx.beginPath();ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x+Math.sin(r)*this.len,this.y+Math.cos(r)*this.len);
    ctx.strokeStyle=`rgba(180,210,255,${this.opa})`;ctx.lineWidth=this.w;ctx.stroke();
  }
}
let drops=[];

function initRain(){
  rainC.width=window.innerWidth;rainC.height=window.innerHeight;
  drops=[];for(let i=0;i<RAIN.drops;i++)drops.push(new Drop(rainC.width,rainC.height,true));
}

// ===== 豪雨描画 =====
function drawRain(){
  const W=rainC.width,H=rainC.height;
  rainX.clearRect(0,0,W,H);
  rainX.fillStyle=`rgba(160,185,210,${RAIN.fogOpa})`;rainX.fillRect(0,0,W,H);
  const gf=rainX.createLinearGradient(0,H*0.55,0,H);
  gf.addColorStop(0,'rgba(180,200,225,0)');gf.addColorStop(1,'rgba(180,200,225,0.4)');
  rainX.fillStyle=gf;rainX.fillRect(0,0,W,H);
  rainX.save();rainX.lineCap='round';
  drops.forEach(d=>{d.update();d.draw(rainX);});
  rainX.restore();
  const vg=rainX.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.9);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,30,40,0.45)');
  rainX.fillStyle=vg;rainX.fillRect(0,0,W,H);
}

// ===== AR障害物描画 =====
function drawAR(){
  const W=arC.width,H=arC.height;
  arX.clearRect(0,0,W,H);
  arX.fillStyle='rgba(165,190,215,0.52)';arX.fillRect(0,0,W,H);
  const gf2=arX.createLinearGradient(0,H*0.5,0,H);
  gf2.addColorStop(0,'rgba(178,200,225,0)');gf2.addColorStop(1,'rgba(178,200,225,0.65)');
  arX.fillStyle=gf2;arX.fillRect(0,0,W,H);
  if(myLat===null)return;
  
  const ob=nearest();

  // 障害物の外周まで5m以内なら、向きに関係なく表示対象にする
  if(!ob || ob.d > 5){
    arX.fillStyle='rgba(200,220,240,0.2)';
    arX.font='12px sans-serif';
    arX.textAlign='center';
    arX.fillText(
      '障害物まで '+(ob ? ob.d.toFixed(1)+'m' : '距離不明'),
      W/2,H*0.52
    );
    return;
  }

  // 5m以内では、距離に応じて表示の濃さを変える
  const clarity=Math.max(0.25,Math.min(1,1-ob.d/5));
  
  const relB = angleDiff(
        bear(myLat, myLng, ob.lat, ob.lng),
        deviceHeading + orientOfs()
  );
  const halfFOV = AR_FOV / 2;
  const ppd = W / AR_FOV;

  // 障害物の幅を考慮し、画面端に一部が入る場合も表示
  const halfObstacleAngle =
      Math.atan2(
      (ob.widthM || 3) / 2,
      Math.max(ob.centerD, 0.5)
    ) * 180 / Math.PI;

  const overlapsFOV =
      Math.abs(relB) <= halfFOV + halfObstacleAngle;
  arX.strokeStyle=`rgba(100,140,180,${0.07*clarity})`;arX.lineWidth=1;arX.setLineDash([4,8]);
  arX.beginPath();arX.moveTo(0,H*0.52);arX.lineTo(W,H*0.52);arX.stroke();arX.setLineDash([]);
  if(overlapsFOV){
    const xC=W/2+relB*ppd;
    const xLabel = Math.max(58, Math.min(W - 58, xC));
    const topH=document.getElementById('top-bar').offsetHeight||60;
    const botH=window.innerHeight*0.45;
    const midH=(topH+(window.innerHeight-botH))/2;
    const yEye=midH*0.88; const yGnd=(window.innerHeight-botH)*0.85;
    const angW=2*Math.atan2(ob.widthM/2,Math.max(ob.centerD,0.5))*180/Math.PI;
    const angH=2*Math.atan2(ob.heightM/2,Math.max(ob.centerD,0.5))*180/Math.PI;
    const pxW=Math.max(40,Math.min(W*0.5,angW*ppd));
    const pxH=Math.max(60,Math.min(H*0.55,angH*ppd*2.8));
    const isClose=ob.d<=ob.radiusM,isNear=ob.d<=OBS_SHOW/2;
    const alpha=Math.min(0.95,0.5+0.45*(1-ob.d/OBS_SHOW))*clarity;
    const fc=isClose?`rgba(255,40,40,${alpha})`:isNear?`rgba(255,110,0,${alpha})`:`rgba(255,200,0,${alpha*0.8})`;
    const lc=isClose?`rgba(255,80,80,${clarity*0.95})`:isNear?`rgba(255,150,0,${clarity*0.9})`:`rgba(255,220,0,${clarity*0.75})`;
    arX.strokeStyle=`rgba(255,120,0,${0.22*clarity})`;arX.lineWidth=1;arX.setLineDash([3,4]);
    arX.beginPath();arX.moveTo(xC,yGnd);arX.lineTo(xC,yEye+pxH/2);arX.stroke();arX.setLineDash([]);
    arX.beginPath();arX.ellipse(xC,yGnd,pxW*0.5,7*Math.max(0.3,1-ob.d/12),0,0,Math.PI*2);
    arX.fillStyle=`rgba(255,60,0,${0.18*clarity})`;arX.fill();
    const bx=xC-pxW/2,by=yEye-pxH/2;
    arX.fillStyle=fc;arX.fillRect(bx,by,pxW,pxH);
    arX.strokeStyle=lc;arX.lineWidth=isClose?3:2;arX.strokeRect(bx,by,pxW,pxH);
    const dp=Math.max(6,pxW*0.18);
    const fc2=fc.replace(/[\d.]+\)$/,`${alpha*0.5})`);
    arX.fillStyle=fc2;
    arX.beginPath();arX.moveTo(bx,by);arX.lineTo(bx+dp,by-dp);arX.lineTo(bx+pxW+dp,by-dp);arX.lineTo(bx+pxW,by);arX.closePath();
    arX.fill();arX.strokeStyle=lc;arX.lineWidth=1;arX.stroke();
    arX.beginPath();arX.moveTo(bx+pxW,by);arX.lineTo(bx+pxW+dp,by-dp);arX.lineTo(bx+pxW+dp,by-dp+pxH);arX.lineTo(bx+pxW,by+pxH);arX.closePath();
    arX.fill();arX.stroke();
    if(isClose&&animFrame%20<10){arX.fillStyle=`rgba(255,40,40,${0.95*clarity})`;arX.font='bold 22px sans-serif';arX.textAlign='center';arX.fillText('⚠',xC,by-dp-22);}
    const cL=Math.max(10,pxW*0.22);
    [[bx,by,1,1],[bx+pxW,by,-1,1],[bx,by+pxH,1,-1],[bx+pxW,by+pxH,-1,-1]].forEach(([cx,cy,sx,sy])=>{
      arX.strokeStyle=lc;arX.lineWidth=isClose?3:2;arX.beginPath();arX.moveTo(cx+sx*cL,cy);arX.lineTo(cx,cy);arX.lineTo(cx,cy+sy*cL);arX.stroke();
    });
    if(clarity>0.2){
      arX.fillStyle=`rgba(0,0,0,${0.55*clarity})`;arX.roundRect(xC-52,by-dp-32,104,26,5);arX.fill();
      arX.fillStyle=`rgba(255,255,255,${clarity})`;arX.font='bold 13px sans-serif';arX.textAlign='center';
      arX.fillText(
          ob.name + '  ' + ob.d.toFixed(0) + 'm',
          xLabel,
          by - dp - 14
    );
    }
    const fadeFog=1-clarity;
    if(fadeFog>0.05){arX.fillStyle=`rgba(175,200,225,${fadeFog*0.75})`;arX.fillRect(bx-12,by-dp-38,pxW+dp+24,pxH+dp+50);}
  } else {
    const sx=relB>0?W-40:40;
    const a2=(0.5+0.35*Math.sin(animFrame*0.1))*Math.max(clarity,0.25);
    arX.fillStyle=`rgba(255,120,0,${a2})`;arX.font='bold 28px sans-serif';arX.textAlign='center';
    arX.fillText(relB>0?'▶':'◀',sx,H/2);arX.font='11px sans-serif';
    arX.fillText(ob.name,sx,H/2+22);arX.fillText(ob.d.toFixed(0)+'m',sx,H/2+36);
  }
}

// ===== ナビ更新：徒歩ルートがあればルートに沿って案内 =====
function updateNav(){
  if(myLat===null || myLng===null) return;
  const ob=nearest(), ofs=orientOfs();
  const arrowEl=document.getElementById('nav-arrow-small');
  const bigArrow=document.getElementById('arrow');
  const plan=ob ? avoidPlan(ob) : null;
  const shouldAvoid=!!(ob && ob.d<=8 && obstacleInPath(ob));

  if(shouldAvoid){
    const ang=bear(myLat,myLng,plan.lat,plan.lng)-deviceHeading+ofs;
    arrowEl.style.transform='rotate('+ang+'deg)';
    arrowEl.className='avoid';
    bigArrow.style.transform='rotate('+ang+'deg)';
    bigArrow.className='avoid';
    elSet('nav-msg','⚠️ '+ob.name+'に接近！'+(plan.side==='right'?'右側':'左側')+'へ回避してください','msg-avoid');
    elSet('nav-dist-top',''); elSet('nav-dist-lbl','');
  } else {
    const progress=getRouteProgress();
    if(progress){
      const ang=progress.bearing-deviceHeading+ofs;
      arrowEl.style.transform='rotate('+ang+'deg)'; arrowEl.className='';
      bigArrow.style.transform='rotate('+ang+'deg)'; bigArrow.className='';
      elSet('nav-msg','徒歩ルートに沿って進んでください','msg-safe');
      elSet('nav-dist-top',Math.round(progress.remaining));
      elSet('nav-dist-lbl','道路沿い残り(m)');
    } else {
      const dg=dist(myLat,myLng,GOAL.lat,GOAL.lng);
      const ang=bear(myLat,myLng,GOAL.lat,GOAL.lng)-deviceHeading+ofs;
      arrowEl.style.transform='rotate('+ang+'deg)'; arrowEl.className='';
      bigArrow.style.transform='rotate('+ang+'deg)'; bigArrow.className='';
      elSet('nav-msg',routeLoading?'🚶 徒歩ルートを取得中...':
        routeError?'⚠️ 徒歩ルート取得失敗・直線案内中':'ゴールへ進んでください','msg-safe');
      elSet('nav-dist-top',Math.round(dg)); elSet('nav-dist-lbl','直線距離(m)');
    }
  }

  const row2=document.getElementById('top-row2');
  if(ob && ob.d<=OBS_SHOW){
    row2.classList.remove('hidden');
    const relB=((bear(myLat,myLng,ob.closestLat,ob.closestLng)-deviceHeading-ofs+180)+540)%360-180;
    const dirs=['正面','右前方','右側','右後方','後方','左後方','左側','左前方'];
    const dname=dirs[Math.round(((relB+360)%360)/45)%8];
    elSet('obs-warn-dist',ob.d.toFixed(0)+' m');
    elSet('obs-warn-dir','方向: '+dname);
    const fill=document.getElementById('obs-warn-bar-fill');
    const ratio=Math.max(0,Math.min(1,1-ob.d/OBS_SHOW));
    fill.style.width=(ratio*100)+'%';
    fill.style.background=ob.d<=ob.radiusM?'#FF3333':ob.d<=OBS_SHOW/2?'#FF8800':'#FFCC00';
    elSet('obs-warn-bar-label',ob.d<=ob.radiusM?'⚠️ 回避範囲内！':'障害物まで '+ob.d.toFixed(0)+'m / 回避範囲 '+ob.radiusM+'m');
  } else row2.classList.add('hidden');
}

// ===== ミニマップ =====
function drawMap(){
  const W=mapC.width,H=mapC.height,cx=W/2,cy=H/2;
  mapX.clearRect(0,0,W,H);
  mapX.fillStyle='rgba(0,14,0,0.97)';mapX.fillRect(0,0,W,H);
  if(myLat===null){mapX.fillStyle='rgba(255,255,255,0.3)';mapX.font='20px sans-serif';mapX.textAlign='center';mapX.fillText('GPS取得中…',cx,cy);return;}
  const dg = dist(myLat, myLng, GOAL.lat, GOAL.lng);
  const maxD = Math.max(routeDistanceM || dg, dg, 30);
  const sc = (W * 0.4) / maxD;
  
const ob = OBSTACLES[0];
const northM = (ob.lat - myLat) * 111320;
const eastM =
  (ob.lng - myLng) *
  111320 *
  Math.cos(myLat * Math.PI / 180);

document.getElementById('map-scale').textContent =
  `GPS ${myLat.toFixed(6)}, ${myLng.toFixed(6)} | ` +
  `障害物との差 北${northM.toFixed(1)}m ` +
  `東${eastM.toFixed(1)}m`;
  mapX.strokeStyle='rgba(100,200,100,0.07)';mapX.lineWidth=0.5;
  [0.33,0.67,1].forEach(r=>{mapX.beginPath();mapX.arc(cx,cy,maxD*r*sc,0,Math.PI*2);mapX.stroke();});
  mapX.strokeStyle='rgba(100,200,100,0.2)';mapX.setLineDash([4,5]);
  mapX.beginPath();mapX.moveTo(cx,cy);mapX.lineTo(cx,10);mapX.stroke();mapX.setLineDash([]);
  mapX.fillStyle='rgba(100,200,100,0.5)';mapX.font='12px sans-serif';mapX.textAlign='center';mapX.fillText('N',cx,20);
  const visPx=RAIN.visM*sc;
  mapX.beginPath();mapX.arc(cx,cy,visPx,0,Math.PI*2);
  mapX.strokeStyle='rgba(100,180,255,0.5)';mapX.lineWidth=1.5;mapX.setLineDash([3,3]);mapX.stroke();mapX.setLineDash([]);
  mapX.fillStyle='rgba(100,180,255,0.07)';mapX.fill();
  mapX.fillStyle='rgba(100,180,255,0.4)';mapX.font='10px sans-serif';
  mapX.fillText('視界'+RAIN.visM+'m',cx,cy-visPx-5);
  const gPx=gps2px(GOAL.lat,GOAL.lng,sc,cx,cy);let avPx=null;
  OBSTACLES.forEach(ob=>{
    const corners=obstacleCorners(ob).map(([lat,lng])=>gps2px(lat,lng,sc,cx,cy));
    const metric=obstacleMetrics(myLat,myLng,ob);
    const d=metric.d;
    const px=gps2px(ob.lat,ob.lng,sc,cx,cy);

    // 四角形の外周を描画
    mapX.beginPath();
    mapX.moveTo(corners[0].x,corners[0].y);
    for(let i=1;i<corners.length;i++) mapX.lineTo(corners[i].x,corners[i].y);
    mapX.closePath();
    mapX.fillStyle='rgba(255,60,60,0.1)';
    mapX.fill();
    mapX.strokeStyle=d<=OBS_SHOW?'rgba(255,60,60,0.85)':'rgba(255,130,60,0.4)';
    mapX.lineWidth=1.5;
    mapX.stroke();

    const size=12;
    mapX.fillStyle='rgba(255,60,60,0.9)';
    mapX.fillRect(px.x-size/2,px.y-size/2,size,size);
    mapX.fillStyle='rgba(255,200,180,0.85)';
    mapX.font='12px sans-serif'; mapX.textAlign='center';
    mapX.fillText(ob.name,px.x,px.y-13);
    mapX.fillStyle='rgba(255,200,100,0.7)';
    mapX.font='11px sans-serif';
    mapX.fillText(Math.round(d)+'m',px.x,px.y+20);
  });;
  
/* 徒歩ルートをミニマップに描画 */
if (routeCoords.length >= 2) {
  mapX.beginPath();

  routeCoords.forEach(([lat, lng], i) => {
    const p = gps2px(lat, lng, sc, cx, cy);

    if (i === 0) {
      mapX.moveTo(p.x, p.y);
    } else {
      mapX.lineTo(p.x, p.y);
    }
  });

  mapX.strokeStyle = '#00FFAA';
  mapX.lineWidth = 4;
  mapX.lineJoin = 'round';
  mapX.lineCap = 'round';
  mapX.setLineDash([]);
  mapX.stroke();
} else {
  // ルート取得前は従来の直線を表示
  mapX.beginPath();
  mapX.moveTo(cx, cy);
  mapX.lineTo(gPx.x, gPx.y);
  mapX.strokeStyle = '#00FFAA';
  mapX.lineWidth = 2;
  mapX.setLineDash([6, 4]);
  mapX.stroke();
  mapX.setLineDash([]);
}
  mapX.beginPath();
  mapX.arc(gPx.x,gPx.y,10,0,Math.PI*2);mapX.fillStyle='#FFD700';mapX.fill();
  mapX.strokeStyle='#FFF';mapX.lineWidth=1.5;mapX.stroke();
  mapX.fillStyle='#000';mapX.font='bold 10px sans-serif';mapX.textAlign='center';mapX.fillText('G',gPx.x,gPx.y+4);
  mapX.fillStyle='rgba(255,215,0,0.8)';mapX.font='11px sans-serif';mapX.fillText(Math.round(routeCoords.length>=2 ? (getRouteProgress()?.remaining ?? dg) : dg)+'m',gPx.x,gPx.y-16);
  const hRad=(deviceHeading+orientOfs())*Math.PI/180;
  mapX.strokeStyle='rgba(100,150,255,0.55)';mapX.lineWidth=1.5;
  mapX.beginPath();mapX.moveTo(cx,cy);mapX.lineTo(cx+Math.sin(hRad)*24,cy-Math.cos(hRad)*24);mapX.stroke();
  mapX.beginPath();mapX.arc(cx,cy,8,0,Math.PI*2);mapX.fillStyle='#4488FF';mapX.fill();mapX.strokeStyle='#FFF';mapX.lineWidth=2;mapX.stroke();
}

// ===== 向き判定（画面の幅＞高さ でも判定する安全仕様） =====
function isLand(){
  if (window.innerWidth > window.innerHeight) return true;
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  return a === 90 || a === 270 || a === -90;
}
function orientOfs(){
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  if(a===90) return -90;
  if(a===270 || a===-90) return 90;
  return 0;
}
function checkOrient(){
  const land = isLand();
  const rot = document.getElementById('rotate-screen');
  const perm = document.getElementById('perm-screen');
  
  if (land) {
    rot.classList.add('hidden');
    if (!document.body.dataset.started) perm.classList.remove('hidden');
  } else {
    if (!document.body.dataset.started) {
      rot.classList.remove('hidden');
      perm.classList.add('hidden');
    }
  }
}

['orientationchange','resize'].forEach(e=>window.addEventListener(e,()=>{checkOrient();sync();}));
if(screen.orientation) screen.orientation.addEventListener('change',()=>{checkOrient();sync();});

// スキップボタン
document.getElementById('skip-rotate-btn')?.addEventListener('click', () => {
  document.getElementById('rotate-screen').classList.add('hidden');
  document.getElementById('perm-screen').classList.remove('hidden');
});

checkOrient();

function sync(){
  arC.width=window.innerWidth;arC.height=window.innerHeight;
  rainC.width=window.innerWidth;rainC.height=window.innerHeight;
  drops.forEach(d=>{d.W=rainC.width;d.H=rainC.height;});
}

document.getElementById('start-btn').addEventListener('click',async()=>{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{const s=await DeviceOrientationEvent.requestPermission();if(s!=='granted'){alert('コンパスの許可が必要です');return;}}catch(e){}
  }
  document.getElementById('perm-screen').classList.add('hidden');
  document.body.dataset.started='1';
  sync();initRain();startGyro();startGPS();
  setInterval(drawMap,500);
  requestAnimationFrame(loop);
});

function loop(){animFrame++;drawRain();drawAR();requestAnimationFrame(loop);}

// ===== GPS & Firebase =====
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;

    sendFire(myLat, myLng);
    updateNav();
    refreshWalkingRoute();
  },(err)=>{
    elSet('send-info','GPSエラー: '+err.code);
  },{enableHighAccuracy:true,maximumAge:0});
}

async function sendFire(lat, lng) {
  // ★ エリア外判定をスキップ（どこからでも確実に送信）
  try {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');

    // ① コレクション名：年月日（例: 20261013）
    const dateCol = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;

    // ② ドキュメント名：時分秒-端末ID（例: 153045-u1a2b3c）
    const timeDoc = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${deviceId}`;

    await setDoc(doc(db, dateCol, timeDoc), {
      lat,
      lng,
      timestamp: serverTimestamp(),
      deviceId
    });

    elSet('send-info', '送信: ' + now.toLocaleTimeString('ja-JP'));
  } catch (e) {
    console.error('Firebase送信エラー:', e);
    elSet('send-info', 'DBエラー: ' + (e.code || e.message));
  }
}

// ===== コンパス =====

function startGyro() {
  function applyHeading(e) {
    // iPhoneなどで利用できるコンパス方位を優先
    if (
      typeof e.webkitCompassHeading === 'number' &&
      Number.isFinite(e.webkitCompassHeading)
    ) {
      deviceHeading = (e.webkitCompassHeading + 360) % 360;
    } else if (
      e.alpha !== null &&
      e.alpha !== undefined &&
      (e.absolute === true ||
       e.type === 'deviceorientationabsolute')
    ) {
      // 標準センサーの回転角を方位角に変換
      deviceHeading = (360 - e.alpha + 360) % 360;
    } else {
      return;
    }

    updateNav();
  }

  window.addEventListener(
    'deviceorientationabsolute', applyHeading, true
  );
  window.addEventListener(
    'deviceorientation', applyHeading, true
  );
}

// ===== ユーティリティ =====
function gps2px(lat,lng,sc,cx,cy){const dLat=lat-myLat,dLng=lng-myLng;return{x:cx+dLng*111000*Math.cos(myLat*Math.PI/180)*sc,y:cy-dLat*111000*sc};}

// 四角形の四隅を緯度・経度で計算
function obstacleCorners(ob){
  const a=(ob.rotationDeg||0)*Math.PI/180;
  const hx=(ob.widthM||3)/2, hy=(ob.heightM||2)/2;
  const c=Math.cos(a), s=Math.sin(a);
  return [[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].map(([x,y])=>{
    const east=x*c-y*s;
    const north=x*s+y*c;
    return [
      ob.lat+north/111320,
      ob.lng+east/(111320*Math.cos(ob.lat*Math.PI/180))
    ];
  });
}

// GPS位置から四角形の外周までの最短距離と最寄り点を計算
function obstacleMetrics(lat,lng,ob){
  const cosLat=Math.cos(ob.lat*Math.PI/180);
  const east=(lng-ob.lng)*111320*cosLat;
  const north=(lat-ob.lat)*111320;
  const a=(ob.rotationDeg||0)*Math.PI/180;
  const c=Math.cos(a), s=Math.sin(a);
  const x=east*c+north*s;
  const y=-east*s+north*c;
  const hx=(ob.widthM||3)/2, hy=(ob.heightM||2)/2;
  const inside=Math.abs(x)<=hx && Math.abs(y)<=hy;
  let qx=Math.max(-hx,Math.min(hx,x));
  let qy=Math.max(-hy,Math.min(hy,y));
  if(inside){
    const edges=[
      {d:hx-x,x:hx,y:y}, {d:hx+x,x:-hx,y:y},
      {d:hy-y,x:x,y:hy}, {d:hy+y,x:x,y:-hy}
    ].sort((u,v)=>u.d-v.d);
    qx=edges[0].x; qy=edges[0].y;
  }
  const d=inside?0:Math.hypot(qx-x,qy-y);
  const eastQ=qx*c-qy*s;
  const northQ=qx*s+qy*c;
  return {
    d,
    centerD:dist(lat,lng,ob.lat,ob.lng),
    closestLat:ob.lat+northQ/111320,
    closestLng:ob.lng+eastQ/(111320*cosLat),
    inside
  };
}

function nearest(){
  if(myLat===null || myLng===null) return null;
  let n=null, m=Infinity;
  OBSTACLES.forEach(o=>{
    const metrics=obstacleMetrics(myLat,myLng,o);
    if(metrics.d<m){m=metrics.d;n=Object.assign({},o,metrics);}
  });
  return n;
}

function angleDiff(a,b){return ((a-b+540)%360)-180;}

// 徒歩ルートがあればルートの進行方向、なければゴール方向を使う
function intendedBearing(){
  const progress=getRouteProgress();
  if(progress) return progress.bearing;
  return bear(myLat,myLng,GOAL.lat,GOAL.lng);
}

// 障害物の左右に回避目標地点を置き、距離が短い側を選択
function avoidPlan(ob){
  const course=intendedBearing();
  const rad=course*Math.PI/180;
  const rightEast=Math.cos(rad), rightNorth=-Math.sin(rad);
  const clearance=Math.hypot((ob.widthM||3)/2,(ob.heightM||2)/2)+1.5;
  function candidate(side){
    const east=rightEast*clearance*side;
    const north=rightNorth*clearance*side;
    return {
      lat:ob.lat+north/111320,
      lng:ob.lng+east/(111320*Math.cos(ob.lat*Math.PI/180))
    };
  }
  const right=candidate(1), left=candidate(-1);
  const rightScore=dist(myLat,myLng,right.lat,right.lng)+dist(right.lat,right.lng,GOAL.lat,GOAL.lng);
  const leftScore=dist(myLat,myLng,left.lat,left.lng)+dist(left.lat,left.lng,GOAL.lat,GOAL.lng);
  return rightScore<=leftScore
    ? Object.assign({side:'right'},right)
    : Object.assign({side:'left'},left);
}

// 障害物が進行経路の前方にあり、端末の向きからも大きく外れていないか判定
function obstacleInPath(ob){
  const course=intendedBearing();
  const rad=course*Math.PI/180;
  const east=(ob.lng-myLng)*111320*Math.cos(myLat*Math.PI/180);
  const north=(ob.lat-myLat)*111320;
  const forward=east*Math.sin(rad)+north*Math.cos(rad);
  const lateral=east*Math.cos(rad)-north*Math.sin(rad);
  const halfDiagonal=Math.hypot((ob.widthM||3)/2,(ob.heightM||2)/2);
  const inRouteCorridor=forward>-1 && Math.abs(lateral)<=halfDiagonal+2;
  const obstacleBearing=bear(myLat,myLng,ob.lat,ob.lng);
  const facingObstacle=Math.abs(angleDiff(obstacleBearing,deviceHeading))<=100;
  return inRouteCorridor && facingObstacle;
}
function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bear(a,b,c,d){const dG=(d-b)*Math.PI/180;const y=Math.sin(dG)*Math.cos(c*Math.PI/180);const x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(dG);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function inPoly(p,vs){let i=false;for(let a=0,b=vs.length-1;a<vs.length;b=a++){const[xa,ya]=vs[a],[xb,yb]=vs[b];if(((ya>p[0])!=(yb>p[0]))&&(p[1]<(xb-xa)*(p[0]-ya)/(yb-ya)+xa))i=!i;}return i;}
function elSet(id,txt,cls){const e=document.getElementById(id);if(!e)return;e.textContent=txt;if(cls!==undefined)e.className=cls;}
</script>
