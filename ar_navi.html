<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR避難ナビ（豪雨シミュレーション）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Helvetica Neue',sans-serif; height:100vh; width:100vw; overflow:hidden; }

/* 横向き指示 */
#rotate-screen {
  position:fixed; inset:0; background:#111;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:1000; padding:20px; text-align:center;
}
#rotate-screen.hidden { display:none; }
.rotate-icon { font-size:64px; margin-bottom:24px; animation:swing 1.5s ease-in-out infinite; }
@keyframes swing { 0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(30deg)} }

/* 権限画面 */
#perm-screen {
  position:fixed; inset:0; background:#111;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:900; padding:24px; text-align:center;
}
#perm-screen.hidden { display:none; }
.start-btn {
  margin-top:28px; padding:16px 44px; font-size:18px; font-weight:bold;
  background:#FFD700; color:#000; border:none; border-radius:12px; cursor:pointer;
}

/* ★ 豪雨オーバーレイ（全画面） */
#rain-canvas {
  position:fixed; inset:0; z-index:50;
  pointer-events:none;
}

/* 3分割メイン */
#main-app { display:none; width:100vw; height:100vh; flex-direction:row; position:relative; }
#main-app.active { display:flex; }

/* 左：マップ */
#panel-left {
  width:33%; height:100%;
  background:rgba(0,12,0,0.95);
  border-right:1px solid rgba(100,200,100,0.2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px;
  position:relative; z-index:60; /* 雨より前面 */
}
.panel-label { font-size:10px; color:rgba(255,255,255,0.3); letter-spacing:1px; margin-bottom:5px; }
#minimap { width:100%; max-width:260px; aspect-ratio:1; border-radius:8px; }
#map-scale { font-size:9px; color:rgba(255,255,255,0.2); margin-top:4px; }

/* 中央：AR */
#panel-mid {
  width:34%; height:100%;
  background:#000;
  border-right:1px solid rgba(80,80,80,0.2);
  position:relative; overflow:hidden;
  z-index:0; /* 雨が重なる */
}

/* 距離インジケーター（雨より前面） */
#obs-distance-bar {
  position:absolute; top:0; left:0; right:0; z-index:60;
  background:rgba(0,0,0,0.85);
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:8px 12px 6px;
  display:flex; align-items:center; justify-content:space-between;
}
#obs-dist-num { font-size:36px; font-weight:900; line-height:1; min-width:80px; }
.obs-dist-safe  { color:#FFCC00; }
.obs-dist-near  { color:#FF8800; }
.obs-dist-close { color:#FF3333; }
#obs-dist-right { text-align:right; }
#obs-name-top { font-size:13px; font-weight:bold; color:rgba(255,255,255,0.9); }
#obs-dir-top  { font-size:11px; color:rgba(255,255,255,0.5); margin-top:2px; }
#obs-unit { font-size:12px; color:rgba(255,255,255,0.4); margin-left:4px; align-self:flex-end; padding-bottom:4px; }

/* 視界限界の表示 */
#visibility-label {
  position:absolute; top:72px; left:0; right:0; z-index:60;
  text-align:center; font-size:11px;
  color:rgba(200,230,255,0.6);
  letter-spacing:1px;
  pointer-events:none;
}

/* 下部バー */
#obs-bar-wrap {
  position:absolute; bottom:0; left:0; right:0; z-index:60;
  padding:6px 12px 8px; background:rgba(0,0,0,0.8);
}
#obs-bar-label { font-size:9px; color:rgba(255,255,255,0.3); margin-bottom:3px; text-align:center; }
#obs-bar-track { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
#obs-bar-fill  { height:100%; border-radius:3px; transition:width 0.5s, background 0.3s; }

#ar-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
#mid-label {
  position:absolute; bottom:24px; left:0; right:0;
  text-align:center; font-size:9px; color:rgba(255,255,255,0.12);
  letter-spacing:1px; z-index:60; pointer-events:none;
}

/* 右：ナビ */
#panel-right {
  width:33%; height:100%; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px;
  position:relative; z-index:60; /* 雨より前面 */
}
#nav-badge {
  font-size:12px; font-weight:bold; padding:6px 18px;
  border-radius:20px; margin-bottom:8px; text-align:center; white-space:nowrap;
}
.badge-wait  { background:rgba(100,100,100,0.7); }
.badge-safe  { background:rgba(30,160,60,0.9); }
.badge-avoid { background:rgba(200,100,0,0.9); }
#arrow-wrap { width:120px; height:120px; display:flex; align-items:center; justify-content:center; margin:8px 0; }
#arrow {
  width:0; height:0;
  border-left:38px solid transparent; border-right:38px solid transparent;
  border-bottom:96px solid #FFD700;
  filter:drop-shadow(0 0 12px rgba(255,215,0,0.9));
  transition:transform .25s ease-out, border-bottom-color .3s;
  transform-origin:center 70%;
}
#arrow.avoid { border-bottom-color:#FF6600; }
#dest-label  { font-size:13px; font-weight:bold; color:#FFD700; text-align:center; min-height:18px; }
#avoid-label { font-size:15px; font-weight:900; color:#FF6600; text-align:center; min-height:22px; margin:2px 0; }
#dist-val    { font-size:42px; font-weight:900; text-align:center; line-height:1; }
#dist-unit   { font-size:13px; color:rgba(255,255,255,0.5); text-align:center; margin-top:2px; }
#send-info   { font-size:9px; color:rgba(255,255,255,0.2); text-align:center; margin-top:10px; }
</style>
</head>
<body>

<!-- 横向き指示 -->
<div id="rotate-screen">
  <div class="rotate-icon">📱</div>
  <div style="font-size:22px;font-weight:bold;margin-bottom:14px;">スマートフォンを横向きに</div>
  <div style="font-size:14px;color:rgba(255,255,255,0.6);line-height:1.8;">
    左右どちら向きでもOKです<br>横向きにすると次の画面が表示されます
  </div>
  <div style="margin-top:24px;font-size:36px;">↔️</div>
</div>

<!-- 権限画面 -->
<div id="perm-screen" class="hidden">
  <div style="font-size:22px;font-weight:bold;margin-bottom:18px;">⛈️ AR避難ナビ<br><span style="font-size:14px;color:rgba(255,255,255,0.5);">豪雨シミュレーション</span></div>
  <div style="font-size:13px;color:rgba(255,255,255,0.65);line-height:2.4;">
    📍 位置情報（GPS）<br>🧭 コンパス（方向センサー）
  </div>
  <button class="start-btn" id="start-btn">許可して開始 ▶</button>
  <div style="margin-top:14px;font-size:10px;color:rgba(255,255,255,0.25);">iOSはSafariで開いてください</div>
</div>

<!-- ★ 全画面豪雨キャンバス -->
<canvas id="rain-canvas"></canvas>

<!-- 3分割メイン -->
<div id="main-app">

  <!-- 左：マップ -->
  <div id="panel-left">
    <div class="panel-label">全体マップ（北↑）</div>
    <canvas id="minimap" width="400" height="400"></canvas>
    <div id="map-scale"></div>
  </div>

  <!-- 中央：ARオーバーレイ -->
  <div id="panel-mid">
    <div id="obs-distance-bar">
      <div style="display:flex;align-items:baseline;gap:4px;">
        <div id="obs-dist-num" class="obs-dist-safe">--</div>
        <div id="obs-unit">m</div>
      </div>
      <div id="obs-dist-right">
        <div id="obs-name-top">取得中...</div>
        <div id="obs-dir-top">方向: --</div>
      </div>
    </div>
    <div id="visibility-label">👁 視界シミュレーション：約5m</div>
    <canvas id="ar-canvas"></canvas>
    <div id="mid-label">AR障害物オーバーレイ</div>
    <div id="obs-bar-wrap">
      <div id="obs-bar-label">障害物との距離</div>
      <div id="obs-bar-track"><div id="obs-bar-fill" style="width:0%;background:#FFCC00;"></div></div>
    </div>
  </div>

  <!-- 右：ゴールナビ -->
  <div id="panel-right">
    <div class="panel-label">ゴールナビ</div>
    <div id="nav-badge" class="badge-wait">📡 GPS取得中</div>
    <div id="arrow-wrap"><div id="arrow"></div></div>
    <div id="dest-label">--</div>
    <div id="avoid-label"></div>
    <div id="dist-val">--</div>
    <div id="dist-unit">目的地まで（m）</div>
    <div id="send-info">送信: 待機中</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBG-JwC9VKwnSHaSkvGLzNLvXtvZ3U0q6M",
  authDomain:"heavy-rain-evacuation.firebaseapp.com",
  projectId:"heavy-rain-evacuation",
  storageBucket:"heavy-rain-evacuation.firebasestorage.app",
  appId:"1:405482442865:web:99c4a046167821b4abcbd0"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ========================================
// ★ 実験設定
// ========================================
const GOAL = { lat:36.1102287, lng:139.3642706, name:"ゴール地点★" };
const OBSTACLES = [
  { lat:36.1095, lng:139.3633, radiusM:3.0, name:"障害物1", widthM:5.0, heightM:3.0 },
];
const AREA = [[36.110889,139.360278],[36.110306,139.367194],[36.105889,139.365111],[36.106222,139.357861]];

// ★ 豪雨・視界設定
const RAIN_CFG = {
  drops      : 250,    // 雨粒の数（増やすと激しくなる）
  speed      : 18,     // 落下速度（px/frame）
  angle      : 20,     // 降る角度（度）風の向き
  lenMin     : 15,     // 雨粒の長さ（最小）
  lenMax     : 35,     // 雨粒の長さ（最大）
  opacity    : 0.55,   // 雨粒の透明度
  fogOpacity : 0.18,   // 全体の霧の濃さ
  visibilityM: 5.0,    // 視界の限界（メートル）
};

const OBS_SHOW_DIST = 15.0; // 距離インジケーターを表示し始める距離
const AR_FOV        = 46;

// ========================================
// 状態変数
// ========================================
let myLat=null, myLng=null, deviceHeading=0, animFrame=0;
let deviceId=(() => {let id=localStorage.getItem('dv');if(!id){id='u'+Math.random().toString(36).slice(2,9);localStorage.setItem('dv',id);}return id;})();

const mapC=document.getElementById('minimap'); const mapX=mapC.getContext('2d');
const arC=document.getElementById('ar-canvas'); const arX=arC.getContext('2d');
const rainC=document.getElementById('rain-canvas'); const rainX=rainC.getContext('2d');

// ========================================
// ★ 雨粒クラス
// ========================================
class RainDrop {
  constructor(W, H, init=false) {
    this.W=W; this.H=H; this.reset(init);
  }
  reset(init=false) {
    this.x = Math.random()*(this.W+200)-100;
    this.y = init ? Math.random()*this.H : -60;
    this.len = RAIN_CFG.lenMin + Math.random()*(RAIN_CFG.lenMax-RAIN_CFG.lenMin);
    this.spd = RAIN_CFG.speed*(0.7+Math.random()*0.6);
    this.opa = RAIN_CFG.opacity*(0.4+Math.random()*0.6);
    this.w   = 0.5+Math.random()*1.2;
    // 遠近感：小さい粒は背景（薄く・細く）
    if (Math.random()<0.3) { this.len*=0.5; this.w*=0.6; this.opa*=0.5; }
  }
  update() {
    const rad=RAIN_CFG.angle*Math.PI/180;
    this.x+=Math.sin(rad)*this.spd;
    this.y+=Math.cos(rad)*this.spd;
    if(this.y>this.H+60||this.x>this.W+100) this.reset();
  }
  draw(ctx) {
    const rad=RAIN_CFG.angle*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x+Math.sin(rad)*this.len, this.y+Math.cos(rad)*this.len);
    ctx.strokeStyle=`rgba(180,210,255,${this.opa})`;
    ctx.lineWidth=this.w;
    ctx.stroke();
  }
}

let rainDrops = [];

function initRain() {
  const W=window.innerWidth, H=window.innerHeight;
  rainC.width=W; rainC.height=H;
  rainDrops=[];
  for(let i=0;i<RAIN_CFG.drops;i++) rainDrops.push(new RainDrop(W,H,true));
}

// ========================================
// ★ 豪雨描画（全画面）
// ========================================
function drawRain() {
  const W=rainC.width, H=rainC.height;
  rainX.clearRect(0,0,W,H);

  // ── 霧（全体の薄い白オーバーレイ）──
  rainX.fillStyle=`rgba(160,185,210,${RAIN_CFG.fogOpacity})`;
  rainX.fillRect(0,0,W,H);

  // ── 地面付近の霧（下から上に薄まる）──
  const gndFog=rainX.createLinearGradient(0,H*0.55,0,H);
  gndFog.addColorStop(0,'rgba(180,200,225,0)');
  gndFog.addColorStop(1,'rgba(180,200,225,0.45)');
  rainX.fillStyle=gndFog; rainX.fillRect(0,0,W,H);

  // ── 雨粒 ──
  rainX.save();
  rainX.lineCap='round';
  rainDrops.forEach(d=>{d.update();d.draw(rainX);});
  rainX.restore();

  // ── 画面周辺の暗い霧（トンネル効果）──
  const vignette=rainX.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.85);
  vignette.addColorStop(0,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(20,30,40,0.5)');
  rainX.fillStyle=vignette; rainX.fillRect(0,0,W,H);
}

// ========================================
// 向き
// ========================================
function isLandscape(){const a=screen.orientation?screen.orientation.angle:(window.orientation||0);return a===90||a===270||a===-90;}
function orientOffset(){const a=screen.orientation?screen.orientation.angle:(window.orientation||0);if(a===90)return -90;if(a===270||a===-90)return 90;return 0;}
function checkOrient(){
  const land=isLandscape(),started=document.getElementById('main-app').classList.contains('active');
  document.getElementById('rotate-screen').classList.toggle('hidden',land);
  if(land&&!started)document.getElementById('perm-screen').classList.remove('hidden');
  if(!land)document.getElementById('perm-screen').classList.add('hidden');
}
['orientationchange','resize'].forEach(e=>window.addEventListener(e,()=>{checkOrient();syncCanvases();}));
screen.orientation&&screen.orientation.addEventListener('change',()=>{checkOrient();syncCanvases();});
checkOrient();

function syncCanvases(){
  const pm=document.getElementById('panel-mid');
  arC.width=pm.offsetWidth; arC.height=pm.offsetHeight;
  rainC.width=window.innerWidth; rainC.height=window.innerHeight;
  rainDrops.forEach(d=>{d.W=rainC.width;d.H=rainC.height;});
}

// ========================================
// 開始
// ========================================
document.getElementById('start-btn').addEventListener('click',async()=>{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{const s=await DeviceOrientationEvent.requestPermission();if(s!=='granted'){alert('コンパスの許可が必要です');return;}}catch(e){}
  }
  document.getElementById('perm-screen').classList.add('hidden');
  document.getElementById('main-app').classList.add('active');
  syncCanvases();
  initRain();
  startGyro(); startGPS();
  setInterval(drawMap,500);
  requestAnimationFrame(mainLoop);
});

// ========================================
// メインループ
// ========================================
function mainLoop(){
  animFrame++;
  drawRain();       // ① 全画面豪雨
  drawAROverlay();  // ② AR障害物
  requestAnimationFrame(mainLoop);
}

// ========================================
// GPS & Firebase
// ========================================
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    sendFire(myLat,myLng); updateNav();
  },()=>{document.getElementById('send-info').textContent='GPSエラー';},{enableHighAccuracy:true,maximumAge:0});
}
async function sendFire(lat,lng){
  if(!inPoly([lat,lng],AREA)){document.getElementById('send-info').textContent='エリア外';return;}
  try{
    await setDoc(doc(db,'oame_live_data',ts()+'-'+deviceId),{lat,lng,timestamp:serverTimestamp(),deviceId});
    document.getElementById('send-info').textContent='送信: '+new Date().toLocaleTimeString('ja-JP');
  }catch(e){}
}

// ========================================
// ナビ更新
// ========================================
function updateNav(){
  if(myLat===null)return;
  const ob=nearest(); const ofs=orientOffset();
  if(ob&&ob.d<=ob.radiusM){
    const avd=avoidDir(ob);
    setArrow(bfv(avd)-deviceHeading+ofs,'avoid');
    el('nav-badge','⚠️ 障害物接近 → 回避！','badge-avoid');
    el('dest-label',ob.name+' に注意！');
    el('avoid-label',avd.isRight?'>> 右に回避 >>':'<< 左に回避 <<');
    el('dist-val',ob.d.toFixed(1)); el('dist-unit','m で障害物');
  } else {
    const dg=dist(myLat,myLng,GOAL.lat,GOAL.lng);
    setArrow(bear(myLat,myLng,GOAL.lat,GOAL.lng)-deviceHeading+ofs,'');
    el('nav-badge','ゴールへ進んでください','badge-safe');
    el('dest-label',GOAL.name); el('avoid-label','');
    el('dist-val',Math.round(dg)); el('dist-unit','目的地まで（m）');
  }
  if(ob) updateObsInfo(ob);
}

function updateObsInfo(ob){
  const numEl=document.getElementById('obs-dist-num');
  const fillEl=document.getElementById('obs-bar-fill');
  const lblEl=document.getElementById('obs-bar-label');
  numEl.textContent=ob.d.toFixed(0);
  numEl.className='obs-dist-safe';
  let bc='#FFCC00';
  if(ob.d<=ob.radiusM){numEl.className='obs-dist-close';bc='#FF3333';}
  else if(ob.d<=OBS_SHOW_DIST/2){numEl.className='obs-dist-near';bc='#FF8800';}
  fillEl.style.background=bc;
  const ratio=Math.max(0,Math.min(1,1-ob.d/OBS_SHOW_DIST));
  fillEl.style.width=(ratio*100)+'%';
  const relB=((bear(myLat,myLng,ob.lat,ob.lng)-deviceHeading-orientOffset())+540)%360-180;
  const dirs=['正面','右前方','右側','右後方','後方','左後方','左側','左前方'];
  const dirName=dirs[Math.round(((relB+360)%360)/45)%8];
  document.getElementById('obs-name-top').textContent=ob.name;
  document.getElementById('obs-dir-top').textContent='方向: '+dirName+'（'+Math.round(relB)+'°）';
  if(ob.d<=ob.radiusM){lblEl.textContent='⚠️ 接近！回避してください';lblEl.style.color='#FF5555';}
  else{lblEl.textContent='障害物まで '+ob.d.toFixed(0)+'m ／ 回避範囲 '+ob.radiusM+'m';lblEl.style.color='rgba(255,255,255,0.3)';}
}

function setArrow(ang,cls){const a=document.getElementById('arrow');a.style.transform='rotate('+ang+'deg)';a.className=cls;}
function el(id,txt,cls){const e=document.getElementById(id);e.textContent=txt;if(cls!==undefined)e.className=cls;}

// ========================================
// ★ AR障害物オーバーレイ（5m視界シミュレーション付き）
// ========================================
function drawAROverlay(){
  const W=arC.width, H=arC.height;
  arX.clearRect(0,0,W,H);

  // ★ 視界限界の霧（AR中央パネルの重い霧）
  // 画面全体に白い霧をかける（遠くが見えない演出）
  const fogStrength = 0.55; // 中央パネルの霧の濃さ（0=なし, 1=完全に白）
  arX.fillStyle=`rgba(170,195,220,${fogStrength})`;
  arX.fillRect(0,0,W,H);

  // 地面霧（さらに下半分を霧で覆う）
  const gf=arX.createLinearGradient(0,H*0.45,0,H);
  gf.addColorStop(0,'rgba(180,205,230,0)');
  gf.addColorStop(1,'rgba(180,205,230,0.7)');
  arX.fillStyle=gf; arX.fillRect(0,0,W,H);

  if(myLat===null)return;
  const ob=nearest();

  // ★ 視界シミュレーション
  // 5m以遠は障害物が霧で見えない
  const visM = RAIN_CFG.visibilityM;

  if(!ob){
    // 「障害物なし」テキスト（霧の中でかすかに）
    arX.fillStyle='rgba(255,255,255,0.3)';arX.font='12px sans-serif';arX.textAlign='center';
    arX.fillText('障害物なし',W/2,H*0.55); return;
  }

  if(ob.d>visM*2){
    // 視界外（完全に霧の中）
    arX.fillStyle='rgba(255,255,255,0.15)';arX.font='11px sans-serif';arX.textAlign='center';
    arX.fillText('視界外（'+ob.d.toFixed(0)+'m先）',W/2,H*0.55); return;
  }

  // 視界内の透明度（距離が近いほど鮮明）
  // 5m=完全に見える、visM*2m=完全に霧
  const clarity = Math.max(0,Math.min(1,(visM*2-ob.d)/visM));

  const relB=((bear(myLat,myLng,ob.lat,ob.lng)-deviceHeading-orientOffset())+540)%360-180;
  const halfFOV=AR_FOV/2;
  const ppd=W/AR_FOV;

  // ホライゾン線
  arX.strokeStyle=`rgba(100,140,180,${0.08*clarity})`;arX.lineWidth=1;arX.setLineDash([4,8]);
  arX.beginPath();arX.moveTo(0,H*0.55);arX.lineTo(W,H*0.55);arX.stroke();arX.setLineDash([]);

  if(Math.abs(relB)<=halfFOV){
    const xC=W/2+relB*ppd;
    const yEye=H*0.44;
    const yGnd=H*0.76;

    // サイズ計算
    const angW=2*Math.atan2(ob.widthM/2,Math.max(ob.d,0.5))*180/Math.PI;
    const angH=2*Math.atan2(ob.heightM/2,Math.max(ob.d,0.5))*180/Math.PI;
    const pxW=Math.max(40,Math.min(W*0.65,angW*ppd));
    const pxH=Math.max(60,Math.min(H*0.65,angH*ppd*2.8));

    const isClose=ob.d<=ob.radiusM;
    const isNear=ob.d<=OBS_SHOW_DIST/2;
    const alpha=Math.min(0.95,0.5+0.45*(1-ob.d/OBS_SHOW_DIST))*clarity;

    const fc=isClose?`rgba(255,40,40,${alpha})`:isNear?`rgba(255,110,0,${alpha})`:`rgba(255,200,0,${alpha*0.8})`;
    const lc=isClose?`rgba(255,80,80,${clarity*0.95})`:isNear?`rgba(255,150,0,${clarity*0.9})`:`rgba(255,220,0,${clarity*0.75})`;

    // 地面との接続線
    arX.strokeStyle=`rgba(255,120,0,${0.25*clarity})`;arX.lineWidth=1;arX.setLineDash([3,4]);
    arX.beginPath();arX.moveTo(xC,yGnd);arX.lineTo(xC,yEye+pxH/2);arX.stroke();arX.setLineDash([]);
    // 影
    arX.beginPath();arX.ellipse(xC,yGnd,pxW*0.5,7*Math.max(0.3,1-ob.d/12),0,0,Math.PI*2);
    arX.fillStyle=`rgba(255,60,0,${0.2*clarity})`;arX.fill();

    const bx=xC-pxW/2,by=yEye-pxH/2;
    // 本体
    arX.fillStyle=fc;arX.fillRect(bx,by,pxW,pxH);
    arX.strokeStyle=lc;arX.lineWidth=isClose?3:2;arX.strokeRect(bx,by,pxW,pxH);
    // 奥行き
    const dp=Math.max(6,pxW*0.18);
    arX.fillStyle=fc.replace(/[\d.]+\)$/,`${alpha*0.5})`);
    arX.beginPath();arX.moveTo(bx,by);arX.lineTo(bx+dp,by-dp);arX.lineTo(bx+pxW+dp,by-dp);arX.lineTo(bx+pxW,by);arX.closePath();
    arX.fill();arX.strokeStyle=lc;arX.lineWidth=1;arX.stroke();
    arX.beginPath();arX.moveTo(bx+pxW,by);arX.lineTo(bx+pxW+dp,by-dp);arX.lineTo(bx+pxW+dp,by-dp+pxH);arX.lineTo(bx+pxW,by+pxH);arX.closePath();
    arX.fill();arX.stroke();
    // 警告点滅
    if(isClose&&animFrame%20<10){
      arX.fillStyle=`rgba(255,40,40,${0.95*clarity})`;
      arX.font='bold 20px sans-serif';arX.textAlign='center';
      arX.fillText('⚠',xC,by-dp-20);
    }
    // コーナーマーカー
    const cL=Math.max(10,pxW*0.22);
    [[bx,by,1,1],[bx+pxW,by,-1,1],[bx,by+pxH,1,-1],[bx+pxW,by+pxH,-1,-1]].forEach(([cx,cy,sx,sy])=>{
      arX.strokeStyle=lc;arX.lineWidth=isClose?3:2;
      arX.beginPath();arX.moveTo(cx+sx*cL,cy);arX.lineTo(cx,cy);arX.lineTo(cx,cy+sy*cL);arX.stroke();
    });
    // 名前ラベル（霧でかすむ）
    if(clarity>0.2){
      arX.fillStyle=`rgba(0,0,0,${0.6*clarity})`;
      arX.roundRect(xC-52,by-dp-30,104,26,5);arX.fill();
      arX.fillStyle=`rgba(255,255,255,${clarity})`;arX.font='bold 13px sans-serif';arX.textAlign='center';
      arX.fillText(ob.name+'  '+ob.d.toFixed(0)+'m',xC,by-dp-12);
    }

    // ★ 霧による視界フェード（障害物を覆う霧）
    // 5m以遠は障害物を白い霧でじわじわ隠す
    const fadeFog=1-clarity;
    if(fadeFog>0.05){
      arX.fillStyle=`rgba(175,200,225,${fadeFog*0.8})`;
      arX.fillRect(bx-10,by-dp-35,pxW+dp+20,pxH+dp+45);
    }

  } else {
    // 視野外インジケーター（霧の中でかすかに）
    const sx=relB>0?W-38:38;
    const a2=(0.6+0.3*Math.sin(animFrame*0.1))*clarity;
    arX.fillStyle=`rgba(255,120,0,${Math.max(a2,0.2)})`;
    arX.font='bold 30px sans-serif';arX.textAlign='center';
    arX.fillText(relB>0?'▶':'◀',sx,H*0.5);
    arX.font='11px sans-serif';
    arX.fillText(ob.name,sx,H*0.5+22);
    arX.fillText(ob.d.toFixed(0)+'m',sx,H*0.5+36);
  }
}

// ========================================
// ミニマップ
// ========================================
function drawMap(){
  const W=mapC.width,H=mapC.height,cx=W/2,cy=H/2;
  mapX.clearRect(0,0,W,H);
  mapX.fillStyle='rgba(0,14,0,0.97)';mapX.fillRect(0,0,W,H);
  if(myLat===null){mapX.fillStyle='rgba(255,255,255,0.3)';mapX.font='18px sans-serif';mapX.textAlign='center';mapX.fillText('GPS取得中…',cx,cy);return;}
  const dg=dist(myLat,myLng,GOAL.lat,GOAL.lng);
  const maxD=Math.max(dg,30);const sc=(W*0.4)/maxD;
  document.getElementById('map-scale').textContent='表示範囲 約'+Math.round(maxD)+'m';
  mapX.strokeStyle='rgba(100,200,100,0.07)';mapX.lineWidth=0.5;
  [0.33,0.67,1].forEach(r=>{mapX.beginPath();mapX.arc(cx,cy,maxD*r*sc,0,Math.PI*2);mapX.stroke();});
  mapX.strokeStyle='rgba(100,200,100,0.2)';mapX.setLineDash([4,5]);
  mapX.beginPath();mapX.moveTo(cx,cy);mapX.lineTo(cx,10);mapX.stroke();mapX.setLineDash([]);
  mapX.fillStyle='rgba(100,200,100,0.5)';mapX.font='11px sans-serif';mapX.textAlign='center';mapX.fillText('N',cx,18);
  const gPx=gps2px(GOAL.lat,GOAL.lng,sc,cx,cy);let avPx=null;
  OBSTACLES.forEach(ob=>{
    const px=gps2px(ob.lat,ob.lng,sc,cx,cy);const d=dist(myLat,myLng,ob.lat,ob.lng);const rp=Math.max(ob.radiusM*sc,8);
    mapX.beginPath();mapX.arc(px.x,px.y,rp,0,Math.PI*2);mapX.fillStyle='rgba(255,60,60,0.1)';mapX.fill();
    mapX.strokeStyle=d<=RAIN_CFG.visibilityM?'rgba(255,60,60,0.9)':'rgba(255,130,60,0.4)';mapX.lineWidth=1.5;mapX.stroke();
    const s=10;mapX.fillStyle='rgba(255,60,60,0.9)';mapX.fillRect(px.x-s/2,px.y-s/2,s,s);
    mapX.fillStyle='rgba(255,200,180,0.85)';mapX.font='11px sans-serif';mapX.textAlign='center';mapX.fillText(ob.name,px.x,px.y-11);
    mapX.fillStyle='rgba(255,200,100,0.7)';mapX.font='10px sans-serif';mapX.fillText(Math.round(d)+'m',px.x,px.y+18);
    const dl=ob.lng-myLng,dt=ob.lat-myLat,len=Math.hypot(dl,dt);
    if(len>0){const m=(ob.radiusM+3)/111000;avPx=gps2px(ob.lat+dl/len*m,ob.lng-dt/len*m,sc,cx,cy);}
  });
  // ★ 視界範囲（5m円）
  const visPx=RAIN_CFG.visibilityM*sc;
  mapX.beginPath();mapX.arc(cx,cy,visPx,0,Math.PI*2);
  mapX.strokeStyle='rgba(100,180,255,0.4)';mapX.lineWidth=1.5;mapX.setLineDash([3,3]);mapX.stroke();mapX.setLineDash([]);
  mapX.fillStyle='rgba(100,180,255,0.08)';mapX.fill();
  mapX.fillStyle='rgba(100,180,255,0.4)';mapX.font='9px sans-serif';mapX.textAlign='center';
  mapX.fillText('視界'+RAIN_CFG.visibilityM+'m',cx,cy-visPx-3);

  mapX.strokeStyle='#00FFAA';mapX.lineWidth=2;mapX.setLineDash([6,4]);
  mapX.beginPath();mapX.moveTo(cx,cy);if(avPx)mapX.lineTo(avPx.x,avPx.y);mapX.lineTo(gPx.x,gPx.y);mapX.stroke();mapX.setLineDash([]);
  mapX.beginPath();mapX.arc(gPx.x,gPx.y,9,0,Math.PI*2);mapX.fillStyle='#FFD700';mapX.fill();
  mapX.strokeStyle='#FFF';mapX.lineWidth=1.5;mapX.stroke();
  mapX.fillStyle='#000';mapX.font='bold 9px sans-serif';mapX.textAlign='center';mapX.fillText('G',gPx.x,gPx.y+3);
  mapX.fillStyle='rgba(255,215,0,0.8)';mapX.font='10px sans-serif';mapX.fillText(Math.round(dg)+'m',gPx.x,gPx.y-13);
  const hRad=(deviceHeading+orientOffset())*Math.PI/180;
  mapX.strokeStyle='rgba(100,150,255,0.55)';mapX.lineWidth=1.5;
  mapX.beginPath();mapX.moveTo(cx,cy);mapX.lineTo(cx+Math.sin(hRad)*22,cy-Math.cos(hRad)*22);mapX.stroke();
  mapX.beginPath();mapX.arc(cx,cy,7,0,Math.PI*2);mapX.fillStyle='#4488FF';mapX.fill();mapX.strokeStyle='#FFF';mapX.lineWidth=2;mapX.stroke();
}

// ========================================
// コンパス
// ========================================
function startGyro(){
  window.addEventListener('deviceorientationabsolute',e=>{if(e.alpha!==null){deviceHeading=e.alpha;updateNav();}},true);
  window.addEventListener('deviceorientation',e=>{
    if(e.webkitCompassHeading!==undefined)deviceHeading=e.webkitCompassHeading;
    else if(e.absolute&&e.alpha!==null)deviceHeading=e.alpha;
    updateNav();
  },true);
}

// ========================================
// ユーティリティ
// ========================================
function gps2px(lat,lng,sc,cx,cy){const dLat=lat-myLat,dLng=lng-myLng;return{x:cx+dLng*111000*Math.cos(myLat*Math.PI/180)*sc,y:cy-dLat*111000*sc};}
function nearest(){let n=null,m=Infinity;OBSTACLES.forEach(o=>{const d=dist(myLat,myLng,o.lat,o.lng);if(d<m){m=d;n=Object.assign({},o,{d});}});return n;}
function avoidDir(ob){const dLat=ob.lat-myLat,dLng=ob.lng-myLng;return{dlat:dLng,dlng:-dLat,isRight:true};}
function bfv(v){return(Math.atan2(v.dlng,v.dlat)*180/Math.PI+360)%360;}
function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bear(a,b,c,d){const dG=(d-b)*Math.PI/180;const y=Math.sin(dG)*Math.cos(c*Math.PI/180);const x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dG);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function inPoly(p,vs){let i=false;for(let a=0,b=vs.length-1;a<vs.length;b=a++){const[xa,ya]=vs[a],[xb,yb]=vs[b];if(((ya>p[0])!=(yb>p[0]))&&(p[1]<(xb-xa)*(p[0]-ya)/(yb-ya)+xa))i=!i;}return i;}
function ts(){const n=new Date();return String(n.getFullYear())+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'-'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0')+String(n.getSeconds()).padStart(2,'0');}
</script>
