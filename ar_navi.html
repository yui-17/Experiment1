<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR避難ナビ（1台完結版）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ステータスバー（上部） */
        #status-bar {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            transition: background 0.5s;
            z-index: 10;
        }
        .status-waiting  { background: rgba(120,120,120,0.85); }
        .status-danger   { background: rgba(200,40,40,0.9);
                           box-shadow: 0 0 20px rgba(255,60,60,0.5); }
        .status-safe     { background: rgba(30,160,60,0.9);
                           box-shadow: 0 0 20px rgba(60,255,100,0.3); }
        .status-avoid    { background: rgba(200,120,0,0.9);
                           box-shadow: 0 0 20px rgba(255,160,0,0.5); }

        /* 矢印 */
        #arrow-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
        }
        #arrow {
            width: 0; height: 0;
            border-left:  55px solid transparent;
            border-right: 55px solid transparent;
            border-bottom: 140px solid #FFD700;
            filter: drop-shadow(0 0 18px rgba(255,215,0,0.9));
            transition: transform 0.25s ease-out, border-bottom-color 0.3s;
            transform-origin: center 70%;
        }
        #arrow.avoid { border-bottom-color: #FF6600; }

        /* 回避指示テキスト */
        #avoidance-text {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 900;
            color: #FF6600;
            text-shadow: 0 0 15px rgba(255,100,0,0.9);
            white-space: nowrap;
            display: none;
        }

        /* 目的地・距離 */
        #destination-label {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 12px rgba(255,215,0,0.7);
            margin-bottom: 10px;
        }
        #distance-display {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
        }
        #distance-unit {
            font-size: 20px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        /* GPS送信状態 */
        #gps-status {
            position: absolute;
            top: 24px;
            right: 16px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-align: right;
        }

        /* iOSジャイロ許可ボタン */
        #permission-btn {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        /* デバッグ情報 */
        #debug-info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="status-bar" class="status-waiting">📡 GPS取得中...</div>
    <div id="avoidance-text"></div>
    <div id="gps-status">送信: 待機中</div>

    <div id="arrow-wrapper">
        <div id="arrow"></div>
    </div>

    <div id="destination-label">--</div>
    <div id="distance-display">--</div>
    <div id="distance-unit">目的地まで</div>

    <button id="permission-btn" onclick="requestGyroPermission()">
        🔄 コンパスを有効にする（iOSのみ）
    </button>

    <div id="debug-info">
        lat: -- | lng: --<br>
        heading: --° | bearing: --°
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ★ Firebase設定
const firebaseConfig = {
    apiKey: "AIzaSyBG-JwC9VKwnSHaSkvGLzNLvXtvZ3U0q6M",
    authDomain: "heavy-rain-evacuation.firebaseapp.com",
    projectId: "heavy-rain-evacuation",
    storageBucket: "heavy-rain-evacuation.firebasestorage.app",
    appId: "1:405482442865:web:99c4a046167821b4abcbd0"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ========================================
// ★ 実験設定（ここを変更してください）
// ========================================

// ゴール地点
const GOAL = { lat: 36.1102287, lng: 139.3642706, name: "ゴール地点★" };

// 障害物リスト（GPS座標で定義）
// lat/lng: 障害物の中心GPS座標
// radiusM: 回避を開始する距離（メートル）
const OBSTACLES = [
    { lat: 36.1095, lng: 139.3633, radiusM: 3.0, name: "障害物1" },
    // 障害物を追加する場合はここに追記
];

// 実験エリア（このエリア外では送信しない）
const AREA_POLYGON = [
    [36.110889, 139.360278],
    [36.110306, 139.367194],
    [36.105889, 139.365111],
    [36.106222, 139.357861]
];

// ========================================
// 状態変数
// ========================================
let myLat       = null;
let myLng       = null;
let deviceHeading = 0;
let deviceId    = getDeviceId();

// ========================================
// デバイスID管理
// ========================================
function getDeviceId() {
    let id = localStorage.getItem('device_id');
    if (!id) {
        id = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('device_id', id);
    }
    return id;
}

// ========================================
// GPS自動取得 & Firestore送信
// ========================================
function startGPS() {
    if (!navigator.geolocation) {
        document.getElementById('gps-status').textContent = 'GPS非対応';
        return;
    }

    navigator.geolocation.watchPosition(
        (position) => {
            myLat = position.coords.latitude;
            myLng = position.coords.longitude;

            // Firestoreに送信
            sendToFirestore(myLat, myLng);

            // ナビ更新
            updateNavigation();

            document.getElementById('debug-info').innerHTML =
                'lat: ' + myLat.toFixed(6) +
                ' | lng: ' + myLng.toFixed(6) + '<br>' +
                'heading: ' + Math.round(deviceHeading) + 'deg' +
                ' | deviceId: ' + deviceId.substring(0, 8);
        },
        (err) => {
            console.error('GPS error:', err);
            document.getElementById('gps-status').textContent = 'GPS取得エラー';
            document.getElementById('status-bar').textContent = 'GPS取得エラー: 位置情報を許可してください';
            document.getElementById('status-bar').className = 'status-waiting';
        },
        { enableHighAccuracy: true, maximumAge: 0 }
    );
}

// Firestoreへ送信
async function sendToFirestore(lat, lng) {
    // エリア外は送信しない
    if (!isInsidePolygon([lat, lng], AREA_POLYGON)) {
        document.getElementById('gps-status').textContent = '送信: エリア外';
        return;
    }
    try {
        const timeId = getTimestampString();
        const docName = timeId + '-' + deviceId;
        await setDoc(doc(db, 'oame_live_data', docName), {
            lat: lat,
            lng: lng,
            timestamp: serverTimestamp(),
            deviceId: deviceId
        });
        document.getElementById('gps-status').textContent =
            '送信: ' + new Date().toLocaleTimeString('ja-JP');
    } catch (e) {
        console.error('送信失敗:', e);
        document.getElementById('gps-status').textContent = '送信失敗';
    }
}

// 現在時刻文字列（ドキュメントID用）
function getTimestampString() {
    const n = new Date();
    return String(n.getFullYear()) +
           String(n.getMonth()+1).padStart(2,'0') +
           String(n.getDate()).padStart(2,'0') + '-' +
           String(n.getHours()).padStart(2,'0') +
           String(n.getMinutes()).padStart(2,'0') +
           String(n.getSeconds()).padStart(2,'0');
}

// ========================================
// ナビゲーション更新
// ========================================
function updateNavigation() {
    if (myLat === null) return;

    // 最も近い障害物を検索
    const nearestObs = getNearestObstacle(myLat, myLng);

    if (nearestObs && nearestObs.distance <= nearestObs.radiusM) {
        // === 回避モード ===
        const avoidDir = calcAvoidDirection(myLat, myLng, nearestObs);
        showAvoidanceMode(avoidDir, nearestObs.distance, nearestObs.name);
    } else {
        // === 通常ナビモード ===
        const distToGoal  = calcDistanceM(myLat, myLng, GOAL.lat, GOAL.lng);
        const bearingGoal = calcBearing(myLat, myLng, GOAL.lat, GOAL.lng);
        const arrowAngle  = bearingGoal - deviceHeading;

        document.getElementById('arrow').style.transform =
            'rotate(' + arrowAngle + 'deg)';
        document.getElementById('arrow').className = '';
        document.getElementById('destination-label').textContent = GOAL.name;
        document.getElementById('distance-display').textContent =
            Math.round(distToGoal) + ' m';
        document.getElementById('avoidance-text').style.display = 'none';

        document.getElementById('status-bar').textContent =
            'ゴールへ進んでください';
        document.getElementById('status-bar').className = 'status-safe';
    }
}

// 回避モードの表示
function showAvoidanceMode(avoidDir, distance, obsName) {
    // 回避方向の矢印角度
    const avoidBearing = calcBearingFromVector(avoidDir);
    const arrowAngle   = avoidBearing - deviceHeading;

    document.getElementById('arrow').style.transform =
        'rotate(' + arrowAngle + 'deg)';
    document.getElementById('arrow').className = 'avoid';

    // 左右どちらか判定してテキスト表示
    const avoidText = document.getElementById('avoidance-text');
    avoidText.style.display = 'block';

    if (avoidDir.isRight) {
        avoidText.textContent = '>> 右に回避 >>';
    } else {
        avoidText.textContent = '<< 左に回避 <<';
    }

    document.getElementById('destination-label').textContent =
        obsName + ' に注意！';
    document.getElementById('distance-display').textContent =
        distance.toFixed(1) + ' m';

    document.getElementById('status-bar').textContent =
        '⚠️ 障害物に接近中 → 回避してください';
    document.getElementById('status-bar').className = 'status-avoid';
}

// ========================================
// 障害物関連
// ========================================
function getNearestObstacle(lat, lng) {
    let nearest = null;
    let minDist = Infinity;
    for (const obs of OBSTACLES) {
        const d = calcDistanceM(lat, lng, obs.lat, obs.lng);
        if (d < minDist) {
            minDist = d;
            nearest = Object.assign({}, obs, { distance: d });
        }
    }
    return nearest;
}

function calcAvoidDirection(myLat, myLng, obs) {
    // 実験者から障害物への方向
    const dLat = obs.lat - myLat;
    const dLng = obs.lng - myLng;

    // 垂直方向（左右）を計算
    const rightDir = { dlat: dLng,  dlng: -dLat, isRight: true  };
    const leftDir  = { dlat: -dLng, dlng:  dLat, isRight: false };

    return rightDir; // ※今後レイキャスト相当の判定に拡張可能
}

function calcBearingFromVector(dir) {
    return (Math.atan2(dir.dlng, dir.dlat) * 180 / Math.PI + 360) % 360;
}

// ========================================
// 計算ユーティリティ
// ========================================
function calcDistanceM(lat1, lng1, lat2, lng2) {
    const R    = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a    = Math.sin(dLat/2)**2 +
                 Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                 Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function calcBearing(lat1, lng1, lat2, lng2) {
    const dLng  = (lng2 - lng1) * Math.PI / 180;
    const lat1R = lat1 * Math.PI / 180;
    const lat2R = lat2 * Math.PI / 180;
    const y     = Math.sin(dLng) * Math.cos(lat2R);
    const x     = Math.cos(lat1R)*Math.sin(lat2R) -
                  Math.sin(lat1R)*Math.cos(lat2R)*Math.cos(dLng);
    return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}

function isInsidePolygon(point, vs) {
    const x = point[0], y = point[1];
    let inside = false;
    for (let i=0, j=vs.length-1; i<vs.length; j=i++) {
        const xi=vs[i][0], yi=vs[i][1], xj=vs[j][0], yj=vs[j][1];
        if (((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi))
            inside = !inside;
    }
    return inside;
}

// ========================================
// コンパス（ジャイロ）設定
// ========================================
function setupGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.getElementById('permission-btn').style.display = 'block';
    } else {
        startListening();
    }
}

window.requestGyroPermission = function() {
    DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
            document.getElementById('permission-btn').style.display = 'none';
            startListening();
        }
    }).catch(console.error);
};

function startListening() {
    window.addEventListener('deviceorientationabsolute', (e) => {
        if (e.alpha !== null) { deviceHeading = e.alpha; updateNavigation(); }
    }, true);
    window.addEventListener('deviceorientation', (e) => {
        if (e.webkitCompassHeading !== undefined) {
            deviceHeading = e.webkitCompassHeading;
        } else if (e.absolute && e.alpha !== null) {
            deviceHeading = e.alpha;
        }
        updateNavigation();
    }, true);
}

// ========================================
// 起動
// ========================================
startGPS();
setupGyro();
</script>
</body>
</html>
